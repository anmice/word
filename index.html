<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Infinity Craft Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top left,#3b82f6 0%,transparent 25%),
    radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 25%),
    #020617;
    color:white;
    position:relative;
}

/* Animated BG */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle,#ffffff22 1px,transparent 1px);
    background-size:35px 35px;
    animation:bgMove 35s linear infinite;
    opacity:.18;
    pointer-events:none;
}

@keyframes bgMove{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-300px,-300px);
    }

}

/* APP */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* TOP */

.topbar{
    height:75px;
    min-height:75px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:700;
    background:
    linear-gradient(
    90deg,
    #60a5fa,
    #c084fc,
    #f472b6
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.stats{
    text-align:right;
    font-size:13px;
}

/* GAME */

.workspace{
    flex:1;
    position:relative;
    overflow:hidden;
    touch-action:none;
}

/* TITLE */

.title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.08);
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    z-index:50;
    white-space:nowrap;
    backdrop-filter:blur(10px);
}

/* SEARCH */

.searchWrap{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    z-index:50;
}

.search{
    width:100%;
    padding:14px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    color:white;
    outline:none;
    font-size:15px;
}

.search::placeholder{
    color:#cbd5e1;
}

/* XP */

.xpWrap{
    position:absolute;
    top:120px;
    left:50%;
    transform:translateX(-50%);
    width:88%;
    z-index:50;
}

.levelText{
    font-size:13px;
    margin-bottom:6px;
}

.xpBar{
    width:100%;
    height:12px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
}

.xpFill{
    width:0%;
    height:100%;
    border-radius:999px;
    background:
    linear-gradient(
    90deg,
    #3b82f6,
    #8b5cf6,
    #ec4899
    );

    transition:.25s;
}

/* TIP */

.tip{
    position:absolute;
    bottom:110px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.08);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    z-index:50;
    white-space:nowrap;
    backdrop-filter:blur(10px);
    transition:.5s;
}

/* DRAGGABLE */

.draggable{
    position:absolute;
    padding:14px 18px;
    border-radius:18px;
    font-weight:700;
    user-select:none;
    touch-action:none;
    cursor:grab;
    z-index:20;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    animation:spawn .18s ease;
    transition:transform .12s;
}

.draggable:active{
    transform:scale(1.05);
}

@keyframes spawn{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* PARTICLES */

.particle{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    pointer-events:none;
    animation:explode .7s linear forwards;
    z-index:999;
}

@keyframes explode{

    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    to{
        transform:
        translate(
        calc(var(--x) * 1px),
        calc(var(--y) * 1px)
        )
        scale(0);

        opacity:0;
    }

}

/* POPUP */

.popup{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(15,23,42,.98);
    border:1px solid rgba(255,255,255,.08);
    padding:30px;
    border-radius:26px;
    text-align:center;
    z-index:1000;
    animation:popup .2s ease;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.popup h1{
    font-size:34px;
    margin-bottom:8px;
}

.popup p{
    opacity:.8;
}

@keyframes popup{

    from{
        transform:translate(-50%,-50%) scale(.6);
        opacity:0;
    }

    to{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }

}

/* BUTTONS */

.clearBtn,
.bookBtn{
    position:absolute;
    width:52px;
    height:52px;
    border:none;
    border-radius:50%;
    color:white;
    font-size:22px;
    z-index:100;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.clearBtn{
    right:15px;
    bottom:115px;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #8b5cf6
    );
}

.bookBtn{
    left:15px;
    bottom:115px;

    background:
    linear-gradient(
    135deg,
    #8b5cf6,
    #ec4899
    );
}

/* BOOK */

.book{
    position:absolute;
    top:0;
    right:-100%;
    width:85%;
    height:100%;
    background:#0f172a;
    z-index:500;
    padding:20px;
    overflow-y:auto;
    transition:.35s;
}

.book.active{
    right:0;
}

.book h2{
    margin-bottom:20px;
}

.bookItem{
    background:rgba(255,255,255,.06);
    padding:14px;
    border-radius:16px;
    margin-bottom:10px;
}

/* BOTTOM */

.bottomPanel{
    height:100px;
    min-height:100px;
    padding:10px;
    overflow-x:auto;
    overflow-y:hidden;

    background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.08);
}

.bottomPanel::-webkit-scrollbar{
    display:none;
}

.elements{
    display:flex;
    gap:10px;
    min-width:max-content;
}

.element{
    min-width:max-content;
    padding:12px 18px;
    border-radius:16px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    transition:.15s;
}

.element:active{
    transform:scale(.95);
}

</style>
</head>
<body>

<div class="app">

    <div class="topbar">

        <div class="logo">
            ∞ Craft
        </div>

        <div class="stats">

            <div>
                Elements:
                <span id="total">4</span>
            </div>

            <div>
                Discoveries:
                <span id="discoveries">0</span>
            </div>

        </div>

    </div>

    <div class="workspace" id="workspace">

        <div class="title">
            Drag & Combine Elements
        </div>

        <div class="searchWrap">

            <input
            type="text"
            class="search"
            id="search"
            placeholder="Search elements...">

        </div>

        <div class="xpWrap">

            <div class="levelText">
                Level <span id="level">1</span>
            </div>

            <div class="xpBar">
                <div class="xpFill"
                id="xpFill"></div>
            </div>

        </div>

        <div class="tip">
            Mix words together to discover new creations ✨
        </div>

        <button
        class="clearBtn"
        onclick="clearBoard()">
        ✕
        </button>

        <button
        class="bookBtn"
        onclick="toggleBook()">
        📖
        </button>

        <div class="book" id="book">

            <h2>Discovery Book</h2>

            <div id="bookList"></div>

        </div>

    </div>

    <div class="bottomPanel">

        <div class="elements"
        id="elements"></div>

    </div>

</div>

<audio id="combineSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=game-notification-199277.mp3">
</audio>

<script>

const baseElements = [
"Water",
"Fire",
"Earth",
"Wind"
];

const combos = {

"Water+Fire":"Steam",
"Fire+Water":"Steam",

"Earth+Water":"Plant",
"Water+Earth":"Plant",

"Fire+Earth":"Lava",
"Earth+Fire":"Lava",

"Wind+Water":"Rain",
"Water+Wind":"Rain",

"Wind+Fire":"Smoke",
"Fire+Wind":"Smoke",

"Plant+Fire":"Ash",
"Fire+Plant":"Ash",

"Lava+Water":"Stone",
"Water+Lava":"Stone",

"Stone+Fire":"Metal",
"Fire+Stone":"Metal",

"Plant+Water":"Tree",
"Water+Plant":"Tree",

"Tree+Fire":"Charcoal",
"Fire+Tree":"Charcoal",

"Metal+Wind":"Plane",
"Wind+Metal":"Plane",

"Steam+Metal":"Engine",
"Metal+Steam":"Engine",

"Engine+Plane":"Jet",
"Plane+Engine":"Jet",

"Rain+Earth":"Life",
"Earth+Rain":"Life",

"Life+Earth":"Human",
"Earth+Life":"Human",

"Human+Metal":"Robot",
"Metal+Human":"Robot",

"Human+Robot":"Cyborg",
"Robot+Human":"Cyborg"

};

const aiWords = [

"Galaxy",
"Dragon",
"Magic",
"Phoenix",
"Shadow",
"Storm",
"Spirit",
"Cyber",
"Future",
"Alien",
"Moon",
"Star",
"Energy",
"Ocean",
"Castle",
"Island",
"Monster",
"Rocket",
"Forest",
"Machine",
"Temple",
"Knight"

];

const colors = {

Water:"#3b82f6",
Fire:"#ef4444",
Earth:"#a16207",
Wind:"#cbd5e1",
Steam:"#94a3b8",
Plant:"#22c55e",
Lava:"#f97316",
Rain:"#0ea5e9",
Smoke:"#64748b",
Ash:"#6b7280",
Stone:"#78716c",
Metal:"#94a3b8",
Tree:"#15803d",
Charcoal:"#111827",
Plane:"#38bdf8",
Engine:"#475569",
Jet:"#8b5cf6",
Life:"#10b981",
Human:"#f472b6",
Robot:"#64748b"

};

let discovered =
JSON.parse(
localStorage.getItem("discoveries")
) || [...baseElements];

let discoveryCount =
Math.max(discovered.length - 4,0);

let xp =
parseInt(
localStorage.getItem("xp")
) || 0;

let level =
parseInt(
localStorage.getItem("level")
) || 1;

const workspace =
document.getElementById("workspace");

const elementsDiv =
document.getElementById("elements");

let combining = false;

/* UI */

function updateUI(){

    document.getElementById("total")
    .innerText =
    discovered.length;

    document.getElementById("discoveries")
    .innerText =
    discoveryCount;

    document.getElementById("xpFill")
    .style.width =
    xp + "%";

    document.getElementById("level")
    .innerText =
    level;

}

/* SAVE */

function saveGame(){

    localStorage.setItem(
    "discoveries",
    JSON.stringify(discovered)
    );

    localStorage.setItem(
    "xp",
    xp
    );

    localStorage.setItem(
    "level",
    level
    );

}

/* RENDER */

function renderElements(filter=""){

    elementsDiv.innerHTML = "";

    discovered
    .filter(item =>
    item.toLowerCase()
    .includes(
    filter.toLowerCase()
    ))

    .forEach(item => {

        const div =
        document.createElement("div");

        div.className = "element";

        div.innerText = item;

        div.style.background =
        colors[item] || "#334155";

        div.onclick =
        () => spawn(item);

        elementsDiv.appendChild(div);

    });

}

/* SPAWN */

function spawn(name){

    const div =
    document.createElement("div");

    div.className = "draggable";

    div.innerText = name;

    div.dataset.name = name;

    div.style.background =
    colors[name] || "#475569";

    div.style.left =
    Math.random() *
    (workspace.clientWidth - 130)
    + "px";

    div.style.top =
    160 +
    Math.random() *
    (workspace.clientHeight - 300)
    + "px";

    workspace.appendChild(div);

    enableDrag(div);

}

/* DRAG */

function enableDrag(el){

    let offsetX = 0;
    let offsetY = 0;

    function start(e){

        e.preventDefault();

        const touch =
        e.touches ? e.touches[0] : e;

        offsetX =
        touch.clientX - el.offsetLeft;

        offsetY =
        touch.clientY - el.offsetTop;

        document.addEventListener(
        "mousemove",
        move
        );

        document.addEventListener(
        "touchmove",
        move,
        { passive:false }
        );

        document.addEventListener(
        "mouseup",
        stop
        );

        document.addEventListener(
        "touchend",
        stop
        );

    }

    function move(e){

        e.preventDefault();

        const touch =
        e.touches ? e.touches[0] : e;

        let x =
        touch.clientX - offsetX;

        let y =
        touch.clientY - offsetY;

        x = Math.max(
        0,
        Math.min(
        x,
        workspace.clientWidth -
        el.offsetWidth
        ));

        y = Math.max(
        0,
        Math.min(
        y,
        workspace.clientHeight -
        el.offsetHeight
        ));

        el.style.left = x + "px";
        el.style.top = y + "px";

        detectCollision(el);

    }

    function stop(){

        document.removeEventListener(
        "mousemove",
        move
        );

        document.removeEventListener(
        "touchmove",
        move
        );

        document.removeEventListener(
        "mouseup",
        stop
        );

        document.removeEventListener(
        "touchend",
        stop
        );

    }

    el.addEventListener(
    "mousedown",
    start
    );

    el.addEventListener(
    "touchstart",
    start,
    { passive:false }
    );

}

/* COLLISION */

function detectCollision(current){

    const all =
    [...document.querySelectorAll(".draggable")];

    all.forEach(other => {

        if(current === other) return;

        const a =
        current.getBoundingClientRect();

        const b =
        other.getBoundingClientRect();

        const overlap = !(

        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom

        );

        if(overlap){

            combine(current,other);

        }

    });

}

/* PARTICLES */

function particles(x,y,color){

    for(let i=0;i<18;i++){

        const p =
        document.createElement("div");

        p.className = "particle";

        p.style.background = color;

        p.style.left = x + "px";
        p.style.top = y + "px";

        p.style.setProperty(
        "--x",
        Math.random()*220-110
        );

        p.style.setProperty(
        "--y",
        Math.random()*220-110
        );

        document.body.appendChild(p);

        setTimeout(()=>{

            p.remove();

        },700);

    }

}

/* XP */

function addXP(){

    xp += 20;

    if(xp >= 100){

        xp = 0;

        level++;

    }

}

/* AI WORD */

function generateRealWord(word1,word2){

    const w1 =
    word1.toLowerCase();

    const w2 =
    word2.toLowerCase();

    if(w1.includes("water")
    && w2.includes("water"))
    return "Ocean";

    if(w1.includes("fire")
    && w2.includes("fire"))
    return "Explosion";

    if(w1.includes("wind")
    && w2.includes("wind"))
    return "Tornado";

    if(w1.includes("earth")
    && w2.includes("earth"))
    return "Mountain";

    return aiWords[
    Math.floor(
    Math.random() *
    aiWords.length
    )];

}

/* COMBINE */

function combine(a,b){

    if(combining) return;

    combining = true;

    const word1 =
    a.dataset.name;

    const word2 =
    b.dataset.name;

    const key =
    word1 + "+" + word2;

    let result =
    combos[key];

    if(!result){

        result =
        generateRealWord(
        word1,
        word2
        );

    }

    particles(
    a.offsetLeft,
    a.offsetTop,
    colors[word1] || "#fff"
    );

    if(navigator.vibrate){

        navigator.vibrate(60);

    }

    const sound =
    document.getElementById("combineSound");

    sound.currentTime = 0;

    sound.play().catch(()=>{});

    a.remove();
    b.remove();

    spawn(result);

    if(!discovered.includes(result)){

        discovered.push(result);

        discoveryCount++;

        addXP();

        updateBook();

        saveGame();

        renderElements();

        updateUI();

        showPopup(result);

    }

    setTimeout(()=>{

        combining = false;

    },80);

}

/* POPUP */

function showPopup(name){

    const div =
    document.createElement("div");

    div.className = "popup";

    div.innerHTML = `

    <h1>${name}</h1>
    <p>New Discovery Unlocked ✨</p>

    `;

    workspace.appendChild(div);

    setTimeout(()=>{

        div.remove();

    },1500);

}

/* BOOK */

function updateBook(){

    const list =
    document.getElementById("bookList");

    list.innerHTML = "";

    discovered.forEach(item => {

        const div =
        document.createElement("div");

        div.className = "bookItem";

        div.innerText = item;

        list.appendChild(div);

    });

}

function toggleBook(){

    document
    .getElementById("book")
    .classList
    .toggle("active");

}

/* CLEAR */

function clearBoard(){

    document
    .querySelectorAll(".draggable")
    .forEach(el => el.remove());

}

/* SEARCH */

document
.getElementById("search")
.addEventListener("input",e=>{

    renderElements(e.target.value);

});

/* START */

renderElements();

updateBook();

updateUI();

/* REMOVE TIP */

setTimeout(()=>{

    const tip =
    document.querySelector(".tip");

    if(tip){

        tip.style.opacity = "0";

        tip.style.transform =
        "translateX(-50%) translateY(20px)";

        setTimeout(()=>{

            tip.remove();

        },500);

    }

},2500);

</script>

</body>
</html>
