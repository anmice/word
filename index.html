<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no"/>

<title>∞ Infinite Craft AI</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
    radial-gradient(circle at bottom right,#9333ea 0%,transparent 30%),
    linear-gradient(180deg,#020617,#0f172a);

    color:white;
    overflow:hidden;
}

/* BG */

body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle,#ffffff12 1px,transparent 1px);

    background-size:34px 34px;

    animation:bgMove 45s linear infinite;

    pointer-events:none;
}

@keyframes bgMove{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-250px,-250px);
    }

}

/* APP */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* TOP */

.topbar{
    height:76px;
    min-height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:16px;

    background:rgba(255,255,255,.07);

    backdrop-filter:blur(18px);

    border-bottom:
    1px solid rgba(255,255,255,.08);

    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:700;

    background:
    linear-gradient(
    90deg,
    #60a5fa,
    #c084fc,
    #f472b6
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.stats{
    font-size:12px;
    line-height:1.6;
    text-align:right;
}

/* WORKSPACE */

.workspace{
    flex:1;
    position:relative;
    overflow:hidden;
    touch-action:none;
}

/* TITLE */

.title{
    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    padding:11px 18px;

    border-radius:999px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    font-size:13px;
    font-weight:600;

    z-index:20;

    white-space:nowrap;
}

/* SEARCH */

.searchWrap{
    position:absolute;

    top:58px;
    left:50%;

    transform:translateX(-50%);

    width:92%;

    z-index:20;
}

.search{
    width:100%;

    padding:15px;

    border:none;
    outline:none;

    border-radius:20px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(15px);

    color:white;

    font-size:15px;
}

.search::placeholder{
    color:#cbd5e1;
}

/* XP */

.xpWrap{
    position:absolute;

    top:118px;
    left:50%;

    transform:translateX(-50%);

    width:88%;

    z-index:20;
}

.levelText{
    font-size:12px;
    margin-bottom:6px;
}

.xpBar{
    width:100%;
    height:12px;

    border-radius:999px;

    overflow:hidden;

    background:
    rgba(255,255,255,.08);
}

.xpFill{
    width:0%;
    height:100%;

    border-radius:999px;

    background:
    linear-gradient(
    90deg,
    #3b82f6,
    #8b5cf6,
    #ec4899
    );

    transition:.3s;
}

/* HINT */

.hintBox{
    position:absolute;

    top:150px;
    left:50%;

    transform:translateX(-50%);

    padding:12px 18px;

    border-radius:16px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    font-size:12px;

    z-index:20;

    animation:float 2s infinite ease-in-out;
}

@keyframes float{

    0%{
        transform:
        translateX(-50%)
        translateY(0px);
    }

    50%{
        transform:
        translateX(-50%)
        translateY(-5px);
    }

    100%{
        transform:
        translateX(-50%)
        translateY(0px);
    }

}

/* DRAGGABLE */

.draggable{
    position:absolute;

    min-width:90px;

    padding:14px 18px;

    border-radius:22px;

    font-size:15px;
    font-weight:700;

    cursor:grab;

    user-select:none;

    touch-action:none;

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.35);

    z-index:10;

    animation:spawn .15s ease;
}

.draggable:active{
    transform:scale(1.05);
}

@keyframes spawn{

    from{
        transform:scale(.6);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* PARTICLES */

.particle{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    pointer-events:none;

    z-index:999;

    animation:explode .7s linear forwards;
}

@keyframes explode{

    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    to{
        transform:
        translate(
        calc(var(--x) * 1px),
        calc(var(--y) * 1px)
        )
        scale(0);

        opacity:0;
    }

}

/* POPUP */

.popup{
    position:absolute;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:85%;
    max-width:320px;

    padding:28px;

    border-radius:28px;

    text-align:center;

    background:
    rgba(15,23,42,.96);

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

    z-index:999;

    animation:popup .18s ease;
}

.popup h1{
    font-size:30px;
    margin-bottom:8px;
}

.popup p{
    font-size:14px;
    line-height:1.6;
}

@keyframes popup{

    from{
        transform:
        translate(-50%,-50%)
        scale(.7);

        opacity:0;
    }

    to{
        transform:
        translate(-50%,-50%)
        scale(1);

        opacity:1;
    }

}

/* BUTTONS */

.clearBtn,
.bookBtn,
.aiBtn{

    position:absolute;

    bottom:112px;

    width:56px;
    height:56px;

    border:none;

    border-radius:50%;

    color:white;

    font-size:22px;

    cursor:pointer;

    z-index:30;

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 10px 30px rgba(0,0,0,.35);
}

.clearBtn{

    right:15px;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #8b5cf6
    );
}

.bookBtn{

    left:15px;

    background:
    linear-gradient(
    135deg,
    #8b5cf6,
    #ec4899
    );
}

.aiBtn{

    left:84px;

    background:
    linear-gradient(
    135deg,
    #06b6d4,
    #3b82f6,
    #8b5cf6
    );

    animation:glow 2s infinite;
}

@keyframes glow{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }

}

/* BOOK */

.book{
    position:absolute;

    top:0;
    right:-100%;

    width:85%;
    height:100%;

    padding:20px;

    overflow-y:auto;

    background:
    rgba(15,23,42,.98);

    backdrop-filter:blur(20px);

    transition:.35s;

    z-index:300;
}

.book.active{
    right:0;
}

.book h2{
    margin-bottom:20px;
}

.bookItem{
    padding:15px;

    margin-bottom:12px;

    border-radius:18px;

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.06);
}

/* BOTTOM */

.bottomPanel{
    height:100px;
    min-height:100px;

    padding:12px;

    overflow-x:auto;
    overflow-y:hidden;

    background:
    rgba(255,255,255,.06);

    backdrop-filter:blur(18px);

    border-top:
    1px solid rgba(255,255,255,.08);
}

.bottomPanel::-webkit-scrollbar{
    display:none;
}

.elements{
    display:flex;
    gap:12px;
    min-width:max-content;
}

.element{
    padding:14px 20px;

    border-radius:18px;

    font-weight:600;

    cursor:pointer;

    user-select:none;

    white-space:nowrap;

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 8px 20px rgba(0,0,0,.25);

    transition:.15s;
}

.element:active{
    transform:scale(.95);
}

</style>
</head>
<body>

<div class="app">

<div class="topbar">

<div class="logo">
∞ Craft
</div>

<div class="stats">

<div>
Elements:
<span id="total">4</span>
</div>

<div>
Discoveries:
<span id="discoveries">0</span>
</div>

</div>

</div>

<div
class="workspace"
id="workspace">

<div class="title">
Drag & Combine Elements
</div>

<div class="searchWrap">

<input
type="text"
class="search"
id="search"
placeholder="Search elements...">

</div>

<div class="xpWrap">

<div class="levelText">
Level
<span id="level">1</span>
</div>

<div class="xpBar">
<div
class="xpFill"
id="xpFill"></div>
</div>

</div>

<div
class="hintBox"
id="hintBox">

Try Water 💧 + Fire 🔥

</div>

<button
class="clearBtn"
onclick="clearBoard()">
✕
</button>

<button
class="bookBtn"
onclick="toggleBook()">
📖
</button>

<button
class="aiBtn"
onclick="showAIInfo()">
🤖
</button>

<div
class="book"
id="book">

<h2>
Discovery Book
</h2>

<div id="bookList"></div>

</div>

</div>

<div class="bottomPanel">

<div
class="elements"
id="elements"></div>

</div>

</div>

<script>

/* ELEMENTS */

const baseElements = [

"Water 💧",
"Fire 🔥",
"Earth 🌍",
"Wind 🌪️"

];

/* COLORS */

const colors = {

"Water 💧":"#3b82f6",
"Fire 🔥":"#ef4444",
"Earth 🌍":"#a16207",
"Wind 🌪️":"#cbd5e1",
"Steam ☁️":"#94a3b8",
"Plant 🌱":"#22c55e",
"Lava 🌋":"#f97316",
"Rain 🌧️":"#0ea5e9",
"Ash 🪵":"#78716c",
"Stone 🪨":"#6b7280",
"Metal ⚙️":"#94a3b8",
"Life 🌱":"#10b981",
"Human 👨":"#f472b6",
"Robot 🤖":"#64748b"

};

/* COMBOS */

const combos = {

"Water 💧+Fire 🔥":"Steam ☁️",
"Fire 🔥+Water 💧":"Steam ☁️",

"Earth 🌍+Water 💧":"Plant 🌱",
"Water 💧+Earth 🌍":"Plant 🌱",

"Fire 🔥+Earth 🌍":"Lava 🌋",
"Earth 🌍+Fire 🔥":"Lava 🌋",

"Wind 🌪️+Water 💧":"Rain 🌧️",
"Water 💧+Wind 🌪️":"Rain 🌧️",

"Plant 🌱+Fire 🔥":"Ash 🪵",
"Fire 🔥+Plant 🌱":"Ash 🪵",

"Lava 🌋+Water 💧":"Stone 🪨",
"Water 💧+Lava 🌋":"Stone 🪨",

"Stone 🪨+Fire 🔥":"Metal ⚙️",
"Fire 🔥+Stone 🪨":"Metal ⚙️",

"Rain 🌧️+Earth 🌍":"Life 🌱",
"Earth 🌍+Rain 🌧️":"Life 🌱",

"Life 🌱+Earth 🌍":"Human 👨",
"Earth 🌍+Life 🌱":"Human 👨",

"Human 👨+Metal ⚙️":"Robot 🤖",
"Metal ⚙️+Human 👨":"Robot 🤖"

};

/* AI WORDS */

const aiResults = [

"Galaxy 🌌",
"Dragon 🐉",
"Magic ✨",
"Shadow 👤",
"Alien 👽",
"Moon 🌙",
"Energy ⚡",
"Ocean 🌊"

];

/* STORAGE */

let discovered =
JSON.parse(
localStorage.getItem("discoveries")
)
||
[...baseElements];

let xp =
parseInt(
localStorage.getItem("xp")
)
|| 0;

let level =
parseInt(
localStorage.getItem("level")
)
|| 1;

let discoveries =
Math.max(
0,
discovered.length - 4
);

const workspace =
document.getElementById("workspace");

const elementsDiv =
document.getElementById("elements");

let combining = false;

/* UI */

function updateUI(){

document
.getElementById("total")
.innerText =
discovered.length;

document
.getElementById("discoveries")
.innerText =
discoveries;

document
.getElementById("level")
.innerText =
level;

document
.getElementById("xpFill")
.style.width =
xp + "%";

}

/* SAVE */

function saveGame(){

localStorage.setItem(
"discoveries",
JSON.stringify(discovered)
);

localStorage.setItem(
"xp",
xp
);

localStorage.setItem(
"level",
level
);

}

/* RENDER */

function renderElements(filter=""){

elementsDiv.innerHTML = "";

discovered

.filter(item =>

item.toLowerCase()

.includes(
filter.toLowerCase()
))

.forEach(item => {

const div =
document.createElement("div");

div.className =
"element";

div.innerText =
item;

div.style.background =
colors[item] || "#334155";

div.onclick =
() => spawn(item);

elementsDiv.appendChild(div);

});

}

/* SPAWN */

function spawn(name){

const div =
document.createElement("div");

div.className =
"draggable";

div.innerText =
name;

div.dataset.name =
name;

div.style.background =
colors[name] || "#475569";

const maxX =
workspace.clientWidth - 130;

const maxY =
workspace.clientHeight - 280;

div.style.left =
Math.max(
10,
Math.random() * maxX
) + "px";

div.style.top =
Math.max(
200,
Math.random() * maxY
) + "px";

workspace.appendChild(div);

enableDrag(div);

}

/* DRAG */

function enableDrag(el){

let offsetX = 0;
let offsetY = 0;

function start(e){

e.preventDefault();

const touch =
e.touches ?
e.touches[0] :
e;

offsetX =
touch.clientX -
el.offsetLeft;

offsetY =
touch.clientY -
el.offsetTop;

document.addEventListener(
"mousemove",
move
);

document.addEventListener(
"touchmove",
move,
{ passive:false }
);

document.addEventListener(
"mouseup",
stop
);

document.addEventListener(
"touchend",
stop
);

}

function move(e){

e.preventDefault();

const touch =
e.touches ?
e.touches[0] :
e;

let x =
touch.clientX -
offsetX;

let y =
touch.clientY -
offsetY;

x = Math.max(
0,
Math.min(
x,
workspace.clientWidth -
el.offsetWidth
));

y = Math.max(
190,
Math.min(
y,
workspace.clientHeight -
el.offsetHeight
));

el.style.left =
x + "px";

el.style.top =
y + "px";

detectCollision(el);

}

function stop(){

document.removeEventListener(
"mousemove",
move
);

document.removeEventListener(
"touchmove",
move
);

document.removeEventListener(
"mouseup",
stop
);

document.removeEventListener(
"touchend",
stop
);

}

el.addEventListener(
"mousedown",
start
);

el.addEventListener(
"touchstart",
start,
{ passive:false }
);

}

/* COLLISION */

function detectCollision(current){

const all =
[
...document.querySelectorAll(".draggable")
];

all.forEach(other => {

if(
current === other
||
combining
||
!document.body.contains(other)
) return;

const a =
current.getBoundingClientRect();

const b =
other.getBoundingClientRect();

const overlap = !(

a.right < b.left ||
a.left > b.right ||
a.bottom < b.top ||
a.top > b.bottom

);

if(overlap){

combine(current,other);

}

});

}

/* PARTICLES */

function particles(x,y,color){

for(let i=0;i<14;i++){

const p =
document.createElement("div");

p.className =
"particle";

p.style.background =
color;

p.style.left =
x + "px";

p.style.top =
y + "px";

p.style.setProperty(
"--x",
Math.random()*220-110
);

p.style.setProperty(
"--y",
Math.random()*220-110
);

document.body.appendChild(p);

setTimeout(()=>{

p.remove();

},700);

}

}

/* XP */

function addXP(){

xp += 20;

if(xp >= 100){

xp = 0;
level++;

}

}

/* AI */

function smartAI(){

return aiResults[
Math.floor(
Math.random() *
aiResults.length
)];

}

/* COMBINE */

function combine(a,b){

if(combining) return;

combining = true;

const word1 =
a.dataset.name;

const word2 =
b.dataset.name;

const key =
word1 + "+" + word2;

let result =
combos[key];

if(!result){

result =
smartAI();

}

particles(
a.offsetLeft,
a.offsetTop,
colors[word1] || "#fff"
);

if(navigator.vibrate){

navigator.vibrate(50);

}

a.remove();
b.remove();

spawn(result);

if(!discovered.includes(result)){

discovered.push(result);

discoveries++;

addXP();

saveGame();

renderElements();

updateBook();

updateUI();

showPopup(result);

}

setTimeout(()=>{

combining = false;

},150);

}

/* POPUP */

function showPopup(name){

const div =
document.createElement("div");

div.className =
"popup";

div.innerHTML = `

<h1>${name}</h1>

<p>
New Discovery Unlocked ✨
</p>

`;

workspace.appendChild(div);

setTimeout(()=>{

div.remove();

},1600);

}

/* BOOK */

function updateBook(){

const list =
document.getElementById("bookList");

list.innerHTML = "";

discovered.forEach(item => {

const div =
document.createElement("div");

div.className =
"bookItem";

div.innerText =
item;

list.appendChild(div);

});

}

function toggleBook(){

document
.getElementById("book")
.classList
.toggle("active");

}

/* AI */

function showAIInfo(){

const div =
document.createElement("div");

div.className =
"popup";

div.innerHTML = `

<h1>🤖 Smart AI</h1>

<p>

Unknown combinations
create random AI words ✨

</p>

`;

workspace.appendChild(div);

setTimeout(()=>{

div.remove();

},2000);

}

/* CLEAR */

function clearBoard(){

document
.querySelectorAll(".draggable")
.forEach(el => el.remove());

}

/* SEARCH */

document
.getElementById("search")
.addEventListener("input",e=>{

renderElements(
e.target.value
);

});

/* START */

renderElements();

updateBook();

updateUI();

</script>

</body>
</html>
